services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database and generated images
      - sqlite_data:/app/backend/storage/data
      # Mount config so you can edit settings without rebuilding
      - ./config:/app/config
    networks:
      - assistant_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - assistant_net
    restart: unless-stopped

volumes:
  sqlite_data:

networks:
  assistant_net:
    driver: bridge
